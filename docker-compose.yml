services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: finoptima
      POSTGRES_PASSWORD: finoptima
      POSTGRES_DB: finoptima
    ports:
      - "5432:5432"
    volumes:
      - finoptima_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finoptima -d finoptima"]
      interval: 3s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/src
      DATABASE_URL: postgresql://finoptima:finoptima@postgres:5432/finoptima
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - finoptima_data:/app/data

volumes:
  finoptima_pg:
  finoptima_data:
